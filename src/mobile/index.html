<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="referrer" content="no-referrer" />
	<meta name="theme-color" content="#121212" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<link rel="manifest" href="/m/manifest.webmanifest" />
	<link rel="apple-touch-icon" href="/m/icons/icon-192.png" />
	<title>DSH Remote</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #121212;
			--bg-card: #1c1c1c;
			--bg-elev: #242424;
			--line: #2e2e2e;
			--text: #f2f2f2;
			--muted: #9a9a9a;
			--accent: #3b82f6;
			--ok: #22c55e;
			--warn: #f59e0b;
			--err: #f87171;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		}
		* { box-sizing: border-box; }
		.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
		html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
		body { display: flex; align-items: center; justify-content: center; padding: 24px; }
		html.connected, body.connected { height: 100dvh; max-height: 100dvh; overflow: hidden; }
		body.connected { display: block; padding: 0; }
		#app {
			width: 100%; max-width: 28rem; padding: 24px;
			background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px;
			line-height: 1.55; font-size: 16px; word-break: break-word;
		}
		body.connected #app, #app.shell {
			position: fixed; inset: 0; max-width: none; height: 100dvh; max-height: 100dvh;
			padding: 0; border: 0; border-radius: 0;
			display: flex; flex-direction: column; background: var(--bg);
			overflow: hidden;
		}
		.notice-wrap {
			flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
			padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
		}
		.notice-card {
			width: 100%; max-width: 22rem; padding: 20px;
			background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px;
			display: flex; flex-direction: column; gap: 12px; text-align: center;
		}
		.notice-card.error { border-color: #5b2b2b; }
		.notice-card.warn { border-color: #5b4a2b; }
		.notice-card h1 { margin: 0; font-size: 18px; font-weight: 600; }
		.notice-card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
		.notice-card .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
		.spinner {
			width: 28px; height: 28px; margin: 0 auto;
			border: 3px solid var(--line); border-top-color: var(--accent);
			border-radius: 50%; animation: spin 0.8s linear infinite;
		}
		@keyframes spin { to { transform: rotate(360deg); } }
		.pair-form {
			flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
			padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
		}
		.pair-card {
			width: 100%; max-width: 22rem; padding: 20px;
			background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px;
			display: flex; flex-direction: column; gap: 12px;
		}
		.pair-card h1 { margin: 0; font-size: 18px; }
		.pair-card label { font-size: 13px; font-weight: 600; }
		.pair-card .hint { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
		.pair-card input {
			font-size: 22px; letter-spacing: 0.12em; text-align: center;
			font-variant-numeric: tabular-nums; text-transform: uppercase;
		}
		.pair-card .err { margin: 0; color: var(--err); font-size: 13px; }
		.bar-err { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
		.bar {
			display: flex; align-items: center; gap: 10px;
			padding: calc(10px + env(safe-area-inset-top)) 16px 12px;
			border-bottom: 1px solid var(--line); flex: 0 0 auto;
		}
		.bar-title { flex: 1 1 auto; min-width: 0; }
		.bar-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.bar .sub { color: var(--muted); font-size: 13px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.bar-actions { flex: 0 0 auto; display: flex; gap: 8px; }
		.bar-err { padding: 6px 16px; color: var(--err); font-size: 13px; flex: 0 0 auto; }
		.col {
			display: flex; flex-direction: column; gap: 12px; padding: 16px;
			flex: 1 1 0; min-height: 0; overflow-x: hidden; overflow-y: scroll;
			-webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
		}
		.col > * { flex: 0 0 auto; }
		.col.session { padding: 0; overflow: hidden; }
		.hero { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 12px 14px; background: var(--bg-elev); border-radius: 12px; display: flex; gap: 8px; align-items: flex-start; }
		.hero p { margin: 0; flex: 1; }
		.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
		.section-h h2 { margin: 0; font-size: 16px; font-weight: 600; }
		.search {
			width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line);
			border-radius: 10px; font: inherit; background: var(--bg-elev); color: var(--text);
		}
		.ws {
			flex: 0 0 auto;
			background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
		}
		.ws-head { display: flex; align-items: stretch; }
		.ws-toggle {
			flex: 1 1 auto; min-width: 0; padding: 12px 14px; border: 0; background: transparent;
			color: inherit; text-align: left; font: inherit;
		}
		.ws-name { font-weight: 600; }
		.badge { font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
		.badge.pending { border-color: #5b2b2b; color: var(--err); }
		.ws-path, .muted { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.icon-btn {
			flex: 0 0 auto; width: 44px; border: 0; border-left: 1px solid var(--line);
			background: transparent; color: var(--text); font: inherit; font-size: 20px;
		}
		.task {
			display: flex; align-items: center; justify-content: space-between; gap: 8px;
			width: 100%; padding: 12px 14px; border: 0; border-top: 1px solid var(--line);
			background: transparent; color: inherit; text-align: left; font: inherit;
		}
		.task-main { flex: 1 1 auto; min-width: 0; }
		.task .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.pill { flex: 0 0 auto; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg-elev); color: var(--muted); white-space: nowrap; }
		.pill.run { background: #1e3a5f; color: #93c5fd; }
		.more-tasks { width: 100%; border: 0; border-top: 1px solid var(--line); padding: 10px; background: transparent; color: var(--muted); font: inherit; }
		.transcript {
			flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto;
			display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;
			-webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
		}
		.bubble-row { display: flex; flex-direction: column; gap: 4px; max-width: 92%; }
		.bubble-row.user { align-self: flex-end; align-items: flex-end; }
		.bubble-row.assistant, .bubble-row.tool { align-self: flex-start; align-items: flex-start; }
		.bubble-label { font-size: 11px; color: var(--muted); padding: 0 4px; }
		.bubble-row.user .bubble-label { text-align: right; }
		.bubble {
			padding: 10px 12px; border-radius: 12px; background: var(--bg-elev);
			white-space: pre-wrap; font-size: 14px; width: 100%;
		}
		.bubble.user { background: #1e3a5f; }
		.bubble.assistant.streaming { box-shadow: 0 0 0 1px rgba(59,130,246,0.35); }
		.bubble.tool {
			color: var(--muted); font-size: 12px; padding: 6px 10px;
			border-radius: 999px; background: var(--bg-card); border: 1px solid var(--line);
		}
		.bubble pre {
			margin: 8px 0 0; padding: 10px 12px; border-radius: 8px;
			background: #0a0a0a; overflow-x: auto; font-size: 12px; line-height: 1.45;
		}
		.bubble pre code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
		.bubble .inline-code {
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
			background: #0006; padding: 0 4px; border-radius: 4px;
		}
		.sheet-mask { position: fixed; inset: 0; background: #0008; z-index: 20; }
		.sheet {
			position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 21;
			background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
			max-height: 70dvh; overflow-y: auto;
		}
		.sheet h3 { margin: 0 0 6px; font-size: 18px; }
		.sheet-dl { margin: 0; display: grid; gap: 8px; font-size: 13px; }
		.sheet-dl div { display: grid; gap: 2px; }
		.sheet-dl dt { color: var(--muted); font-size: 11px; }
		.sheet-dl dd { margin: 0; word-break: break-all; }
		.composer { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); flex: 0 0 auto; }
		.composer-row { display: flex; gap: 8px; align-items: flex-end; }
		.mode-toggle { display: flex; gap: 6px; }
		.mode-toggle .mode {
			flex: 1 1 0; min-height: 36px; padding: 6px 10px;
			background: var(--bg-elev); color: var(--muted); border: 1px solid var(--line);
		}
		.mode-toggle .mode.active {
			background: #1e3a5f; color: #93c5fd; border-color: #1e3a5f; font-weight: 600;
		}
		.mode-hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
		.card.focus-target { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent); }
		textarea, input[type="text"] {
			width: 100%; min-height: 48px; max-height: 120px; padding: 10px 12px;
			border: 1px solid var(--line); border-radius: 12px; font: inherit;
			background: var(--bg-elev); color: var(--text); resize: none;
		}
		button { border: 0; border-radius: 10px; padding: 8px 12px; background: var(--accent); color: #fff; font: inherit; min-height: 44px; }
		button.ghost { background: var(--bg-elev); color: var(--text); }
		button.danger { background: #7f1d1d; color: #fecaca; }
		button:disabled { opacity: 0.55; }
		.inbox { display: flex; flex-direction: column; gap: 8px; padding: 0 16px; flex: 0 0 auto; }
		.card {
			display: flex; flex-direction: column; gap: 8px; padding: 12px;
			border: 1px solid #5b2b2b; border-radius: 12px; background: #2a1515;
		}
		.card .ctx { margin: 0; font-size: 12px; color: var(--muted); }
		.card .ctx-link {
			border: 0; background: transparent; color: var(--accent); padding: 0;
			min-height: auto; font-size: 12px; text-align: left;
		}
		.actions, .opt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
		.opt { padding: 8px; border: 1px solid var(--line); border-radius: 10px; }
		.opt input { flex: 0 0 auto; }
		.opt-description { flex: 1 0 100%; margin-left: 24px; color: var(--muted); font-size: 12px; line-height: 1.4; }
		.toast {
			position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom));
			transform: translateX(-50%); z-index: 30;
			padding: 8px 14px; border-radius: 999px; background: var(--bg-elev);
			border: 1px solid var(--line); color: var(--text); font-size: 13px;
			pointer-events: none; opacity: 0; transition: opacity 0.2s;
		}
		.toast.show { opacity: 1; }
		.empty-hint { margin: 0; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
		.lang-switch { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: var(--muted); }
		.lang-switch button { min-height: auto; padding: 4px 6px; font-size: 12px; background: transparent; color: var(--muted); }
		.lang-switch button.active { color: var(--text); font-weight: 600; }
		.bar-actions .lang-switch { justify-content: flex-end; }
		button:focus-visible, input:focus-visible, textarea:focus-visible, [role="dialog"]:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 72%, transparent); outline-offset: 2px; }
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main id="app">Loading…</main>
	<script src="/m/app.js"></script>
</body>
</html>
