<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="referrer" content="no-referrer" />
	<title>远程控制</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #121212;
			--bg-card: #1c1c1c;
			--bg-elev: #242424;
			--line: #2e2e2e;
			--text: #f2f2f2;
			--muted: #9a9a9a;
			--accent: #3b82f6;
			--ok: #22c55e;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		}
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
		body { display: flex; align-items: center; justify-content: center; padding: 24px; }
		html.connected, body.connected { height: 100dvh; max-height: 100dvh; overflow: hidden; }
		body.connected { display: block; padding: 0; }
		#app {
			width: 100%; max-width: 28rem; padding: 24px;
			background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px;
			white-space: pre-wrap; line-height: 1.55; font-size: 16px; word-break: break-word;
		}
		body.connected #app {
			max-width: none; height: 100dvh; max-height: 100dvh; padding: 0; border: 0; border-radius: 0;
			white-space: normal; display: flex; flex-direction: column; background: var(--bg);
			overflow: hidden;
		}
		.bar {
			display: flex; align-items: center; gap: 10px; padding: 14px 16px;
			border-bottom: 1px solid var(--line);
		}
		.bar .sub { color: var(--muted); font-size: 13px; font-weight: 400; }
		.bar .err { color: #f87171; font-size: 13px; }
		.col {
			display: flex; flex-direction: column; gap: 12px; padding: 16px;
			flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto;
			-webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
		}
		.col.session { padding: 0; overflow: hidden; }
		.hero { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 12px 14px; background: var(--bg-elev); border-radius: 12px; }
		.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
		.section-h h2 { margin: 0; font-size: 16px; font-weight: 600; }
		.ws {
			background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
		}
		.ws-head {
			display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
			width: 100%; padding: 12px 14px; background: transparent; border: 0; color: inherit; text-align: left; font: inherit;
		}
		.ws-name { font-weight: 600; }
		.badge { font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); margin-left: 6px; }
		.ws-path, .muted { color: var(--muted); font-size: 12px; }
		.icon-btn {
			width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--bg-elev); color: var(--text); font: inherit;
		}
		.task {
			display: flex; align-items: center; justify-content: space-between; gap: 8px;
			width: 100%; padding: 12px 14px; border: 0; border-top: 1px solid var(--line);
			background: transparent; color: inherit; text-align: left; font: inherit;
		}
		.task .title { font-weight: 500; }
		.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #16351f; color: var(--ok); }
		.pill.run { background: #1e3a5f; color: #93c5fd; }
		.row { display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-card); text-align: left; font: inherit; color: inherit; }
		.transcript {
			flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto;
			display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;
			-webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
		}
		.sheet-mask { position: fixed; inset: 0; background: #0008; z-index: 20; }
		.sheet {
			position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 21;
			background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
		}
		.sheet h3 { margin: 0 0 6px; font-size: 18px; }
		.sheet-item {
			display: flex; width: 100%; margin-top: 8px; padding: 14px; border: 0; border-radius: 12px;
			background: var(--bg-elev); color: inherit; text-align: left; font: inherit;
		}
		.bubble { padding: 10px 12px; border-radius: 12px; background: var(--bg-elev); white-space: pre-wrap; font-size: 14px; }
		.bubble.user { background: #1e3a5f; }
		.bubble.tool { color: var(--muted); font-size: 13px; }
		.bubble code, .inline-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: #0006; padding: 0 4px; border-radius: 4px; }
		.composer { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
		textarea, input[type="text"] {
			width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line);
			border-radius: 12px; font: inherit; background: var(--bg-elev); color: var(--text);
		}
		button { border: 0; border-radius: 10px; padding: 8px 12px; background: var(--accent); color: #fff; font: inherit; }
		button.ghost { background: var(--bg-elev); color: var(--text); }
		button:disabled { opacity: 0.55; }
		.inbox { display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
		.card { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #5b2b2b; border-radius: 12px; background: #2a1515; }
		.actions, .opt { display: flex; gap: 8px; align-items: center; }
		.toast { color: var(--muted); font-size: 13px; }
	</style>
</head>
<body>
	<main id="app">加载中…</main>
	<script src="/m/app.js"></script>
</body>
</html>
